const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYNAME="s27key:"+SALT;
async function open(key){
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(DATA)));
  // show the app in its own full-screen frame (same site, so votes and settings are kept), clear of this page's styles
  const f=document.createElement("iframe"); f.title="Summer 2027"; f.setAttribute("allow","fullscreen; geolocation");
  f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff";
  document.body.replaceChildren(f); document.body.style.cssText="margin:0;padding:0;display:block;overflow:hidden";
  f.srcdoc=html;
}
async function fromPw(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{ try{ const raw=localStorage.getItem(KEYNAME); if(raw){ const k=await crypto.subtle.importKey("raw",u8(raw),"AES-GCM",false,["decrypt"]); await open(k); } }catch(e){ try{localStorage.removeItem(KEYNAME)}catch(_){} } })();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const b=document.getElementById("go"), m=document.getElementById("msg"); b.disabled=true; b.textContent="Unlocking…"; m.textContent="";
  try{ const k=await fromPw(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){ try{ const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k)); localStorage.setItem(KEYNAME,btoa(String.fromCharCode(...raw))); }catch(_){} }
    await open(k);
  }catch(err){ b.disabled=false; b.textContent="Open"; m.textContent="That password didn't work. Try again."; }
});
